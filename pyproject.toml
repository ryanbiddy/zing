[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myzing"
version = "0.1.0"
description = "Zing: the video director. Reverse-engineers the editing style of short videos you admire, directs your raw footage with gap reports and shot prompts, and assembles the edit locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=2.3,<3", "myzing[render]"]
study = [
    "yt-dlp[default]>=2026.6",
    "scenedetect-headless>=0.7",
    "faster-whisper>=1.1",
    "onnxruntime>=1.16",
    "rapidocr>=3.9",
]
# SDK 2.3's MCPServer supports legacy initialization and stateless 2026-07-28
# over stdio. Keep the next major gated on a deliberate port and wire replay.
# SDK 1 compatibility evidence and regeneration: docs/MCP-SDK2.md.
mcp = ["mcp>=2.3,<3"]
render = ["pysubs2>=1.8.1"]
audio = ["numpy>=1.24,<3"]
audio-ml = ["myzing[audio]", "sherpa-onnx>=1.13,<3"]
memes = ["Pillow>=10.4"]
fonts = ["Pillow>=10.4", "opencv-python-headless==4.13.0.92"]
layout = ["opencv-python-headless==4.13.0.92"]
color = ["numpy>=1.24"]
all = ["myzing[study]", "myzing[mcp]", "myzing[render]", "myzing[memes]", "myzing[fonts]", "myzing[layout]", "myzing[color]", "myzing[audio]", "myzing[audio-ml]"]

[project.scripts]
zing = "myzing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myzing = ["_data/prompts/*.md", "_data/presets/*.json", "_data/docs/*.md", "_data/memes/*.json", "_data/fonts/*.ttf", "_data/fonts/*.txt", "_data/fonts/*.json", "_data/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import tools.eval.*; without this, a file run on its own fails to
# collect unless an earlier test module happened to add the repo root.
pythonpath = ["."]
markers = [
    "real_media: opt-in local pinned real-video regression; no downloads (ZING_REAL_TRANSITIONS=1)",
    "real_caption: opt-in pinned real-video caption check (ZING_CG2_REAL_ROOT)",
]

[tool.uv]
# RapidOCR uses cv2 but requests the GUI wheel. scenedetect-headless/layout
# supply the same API; installing both wheels overwrites the pinned runtime.
exclude-dependencies = ["opencv-python"]
