[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "myzing"
version = "1.0.0rc1"
description = "A free, local creative studio for short videos and memes that runs in your terminal and that AI agents can drive."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "docs/THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Ryan Biddy"}]
keywords = ['video', 'shorts', 'clips', 'podcast', 'ffmpeg', 'mcp', 'captions']
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://myzing.app"
Source = "https://github.com/ryanbiddy/zing"
Issues = "https://github.com/ryanbiddy/zing/issues"
Changelog = "https://github.com/ryanbiddy/zing/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ryanbiddy/zing/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=2.3,<3", "myzing[render]"]
study = [
    "yt-dlp[default]>=2026.10.21",
    "scenedetect-headless>=0.7",
    "faster-whisper>=1.1",
    "onnxruntime>=1.16",
    "rapidocr>=3.9",
]
# SDK 2.3's MCPServer supports legacy initialization and stateless 2026-07-28
# over stdio. Keep the next major gated on a deliberate port and wire replay.
# SDK 1 compatibility evidence and regeneration: docs/MCP-SDK2.md.
mcp = ["mcp>=2.3,<3"]
render = ["pysubs2>=1.8.1"]
audio = ["numpy>=1.24,<3"]
audio-ml = ["myzing[audio]", "sherpa-onnx>=2.0,<3"]
memes = ["Pillow>=13.0"]
fonts = ["Pillow>=13.0", "opencv-python-headless==4.13.0.92"]
layout = ["opencv-python-headless==4.13.0.92"]
factory = ["myzing[study]", "Pillow>=13.0", "opencv-python-headless==4.13.0.92", "numpy>=1.24"]
screen = ["pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'"]
color = ["numpy>=1.24"]
all = ["myzing[study]", "myzing[mcp]", "myzing[render]", "myzing[memes]", "myzing[fonts]", "myzing[layout]", "myzing[color]", "myzing[audio]", "myzing[audio-ml]", "myzing[screen]", "myzing[factory]"]

[project.scripts]
zing = "myzing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myzing = ["_data/prompts/*.md", "_data/presets/*.json", "_data/docs/*.md", "_data/memes/*.json", "_data/fonts/*.ttf", "_data/fonts/*.txt", "_data/fonts/*.json", "_data/schemas/*.json", "_data/factory/*.html", "_data/factory/*.cjs", "_data/factory/sidecar/*.json", "_data/factory/sidecar/*.cjs", "_data/factory/prompts/*.md", "_data/factory/themes/*.json", "_data/channels/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import tools.eval.*; without this, a file run on its own fails to
# collect unless an earlier test module happened to add the repo root.
pythonpath = ["."]
markers = [
    "real_media: opt-in local pinned real-video regression; no downloads (ZING_REAL_TRANSITIONS=1)",
    "real_caption: opt-in pinned real-video caption check (ZING_CG2_REAL_ROOT)",
]

[tool.uv]
# RapidOCR uses cv2 but requests the GUI wheel. scenedetect-headless/layout
# supply the same API; installing both wheels overwrites the pinned runtime.
exclude-dependencies = ["opencv-python"]
