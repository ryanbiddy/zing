name: Release

# Ryan only. A push, tag or pull request can never invoke publication.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index (try TestPyPI first)
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      draft_release:
        description: Also create a draft GitHub release (PyPI target only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  UOINK_URL: http://127.0.0.1:1
  PYTHONIOENCODING: utf-8

concurrency:
  group: release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - name: Build sdist and wheel from sdist
        run: uv build
      - name: Check metadata in a throwaway venv
        run: |
          uv venv "$RUNNER_TEMP/twine"
          uv pip install --python "$RUNNER_TEMP/twine/bin/python" twine
          "$RUNNER_TEMP/twine/bin/python" -m twine check --strict dist/*
      - run: python packaging/audit_dist.py
      - name: Check release surfaces and extract notes
        id: version
        run: python packaging/release_notes.py --output release-notes.md --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  fresh-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v6.0.0
        with:
          name: distributions
          path: dist
      - run: python packaging/fresh_install_check.py --report fresh-install-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: fresh-install-${{ matrix.os }}
          path: fresh-install-*.json
          if-no-files-found: error

  publish:
    needs: [build, fresh-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer protection must be configured on BOTH environments.
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6.0.0
        with:
          name: distributions
          path: dist
      - name: Publish to TestPyPI using OIDC
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI using OIDC
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@v1.14.3

  draft-release:
    if: inputs.draft_release && inputs.target == 'pypi'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6.0.0
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v6.0.0
        with:
          name: release-notes
          path: notes
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" dist/* --target "$RELEASE_COMMIT" \
            --draft --prerelease --title "Zing $VERSION" --notes-file notes/release-notes.md
