name: Release

# Ryan only. A push, tag or pull request can never invoke publication.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index (PyPI requires TestPyPI first)
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      draft_release:
        description: Also create a draft GitHub release (PyPI target only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  UOINK_URL: http://127.0.0.1:1
  PYTHONIOENCODING: utf-8

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-ci:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      testpypi_published: ${{ steps.history.outputs.testpypi_published }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.11'
      - name: Check CI and prior TestPyPI uploads
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python packaging/release_gate.py

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.13.4
      - name: Build sdist and wheel from sdist
        run: uv build
      - name: Check metadata in a throwaway venv
        run: |
          uv venv "$RUNNER_TEMP/twine"
          uv pip install --python "$RUNNER_TEMP/twine/bin/python" twine==7.0.0
          "$RUNNER_TEMP/twine/bin/python" -m twine check --strict dist/*
      - run: python packaging/audit_dist.py
      - name: Check release surfaces and extract notes
        id: version
        run: python packaging/release_notes.py --output release-notes.md --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  fresh-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: distributions
          path: dist
      - run: python packaging/fresh_install_check.py --report fresh-install-${{ matrix.os }}-${{ matrix.python }}.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: fresh-install-${{ matrix.os }}-${{ matrix.python }}
          path: fresh-install-*.json
          if-no-files-found: error

  testpypi:
    if: needs.check-ci.outputs.testpypi_published != 'true'
    needs: [build, fresh-install, check-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: distributions
          path: dist
      - name: Publish to TestPyPI using OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    if: >-
      always() && !cancelled() && inputs.target == 'pypi' &&
      needs.build.result == 'success' && needs.fresh-install.result == 'success' &&
      needs.check-ci.result == 'success' &&
      (needs.testpypi.result == 'success' || needs.check-ci.outputs.testpypi_published == 'true')
    needs: [build, fresh-install, check-ci, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  draft-release:
    if: inputs.draft_release && inputs.target == 'pypi'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: release-notes
          path: notes
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" dist/* --target "$RELEASE_COMMIT" \
            --draft --prerelease --title "Zing $VERSION" --notes-file notes/release-notes.md
