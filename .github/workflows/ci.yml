name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Fast mocked-unit matrix. The ffmpeg-marked subset is excluded here
  # explicitly and enforced (skips impossible) in the dedicated jobs below.
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ZING_REQUIRE_OTIO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .[dev,color,audio,memes] "OpenTimelineIO>=0.18,<0.19"
      - run: pytest -q -m "not ffmpeg"

  # F-01 / C-1.3 / C#8 / C#9 — the real ffmpeg gates, Ubuntu (full):
  # ffmpeg installed explicitly, version + required filters verified up
  # front, golden generation + eval scorer + the ffmpeg-marked tests run
  # for real. ZING_REQUIRE_FFMPEG=1 makes tests/conftest.py FAIL (never
  # skip or xfail) every selected test, while the exact count pin makes
  # any accidental deselection fatal — this job cannot silently degrade
  # to mocked-only coverage. P7 adds real OCR on generated caption videos;
  # models are provisioned explicitly before the offline inference tests.
  ffmpeg-gates-ubuntu:
    timeout-minutes: 30
    runs-on: ubuntu-24.04  # pinned: this gate covers apt FFmpeg 6.x; ubuntu-latest moved to 26.04 (FFmpeg 8, libass 0.17.4)
    env:
      ZING_REQUIRE_FFMPEG: "1"
      ZING_REQUIRE_OCR: "1"
      ZING_TEST_FETCH_FONTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ffmpeg (apt)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify ffmpeg version and required filters (C#8)
        run: |
          ffmpeg -version
          ffprobe -version
          for filter in drawtext subtitles sidechaincompress lut3d xfade acrossfade zoompan; do
            if ffmpeg -hide_banner -filters | awk '{print $2}' | grep -qx "$filter"; then
              echo "filter present: $filter"
            else
              echo "::error::required ffmpeg filter missing: $filter"
              exit 1
            fi
          done
      - run: pip install -e .[dev,layout,color,audio,memes,study] "rapidocr==3.9.1"
      # pip cannot apply tool.uv.exclude-dependencies: RapidOCR requests the
      # GUI cv2 wheel. Restore the single pinned headless runtime after install.
      - run: pip uninstall -y opencv-python
      - run: pip install --force-reinstall --no-deps opencv-python-headless==4.13.0.92
      - name: Provision pinned font library (explicit download; matching stays offline)
        run: zing fonts fetch --all
      - name: Provision pinned caption OCR models (explicit download; study stays offline)
        run: python -m myzing.study.caption_models --fetch
      - name: Golden generation (real ffmpeg fixtures, hostile paths)
        run: python -m tools.eval.make_goldens --output "tools/eval/goldens"
      - name: Breakdown + profile eval with machine-readable report
        run: python -m tools.eval.run --sample --profiles --report "tools/eval/eval-report.json"
      - name: ffmpeg-marked test subset (skips are failures)
        run: pytest -q -m ffmpeg --expected-ffmpeg-tests 364
      - name: Keep eval report as artifact on failure (C#9)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-ubuntu
          path: tools/eval/eval-report.json
          if-no-files-found: warn

  # Same strict gate on the newest GitHub Ubuntu image (ubuntu-latest is
  # Ubuntu 26.04 "resolute" since Oct 2026: apt FFmpeg 8.0.1, libass 0.17.4,
  # FreeType/HarfBuzz from that release). The job above stays pinned to
  # 24.04 for FFmpeg 6.x; this one catches regressions on current distros.
  ffmpeg-gates-ubuntu-latest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ZING_REQUIRE_FFMPEG: "1"
      ZING_REQUIRE_OCR: "1"
      ZING_TEST_FETCH_FONTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ffmpeg (apt)
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Verify ffmpeg version and required filters (C#8)
        run: |
          grep PRETTY_NAME /etc/os-release
          dpkg-query -W libass9 libfreetype6 'libharfbuzz0*' fonts-dejavu-core || true
          ffmpeg -version
          ffprobe -version
          for filter in drawtext subtitles sidechaincompress lut3d xfade acrossfade zoompan; do
            if ffmpeg -hide_banner -filters | awk '{print $2}' | grep -qx "$filter"; then
              echo "filter present: $filter"
            else
              echo "::error::required ffmpeg filter missing: $filter"
              exit 1
            fi
          done
      - run: pip install -e .[dev,layout,color,audio,memes,study] "rapidocr==3.9.1"
      - run: pip uninstall -y opencv-python
      - run: pip install --force-reinstall --no-deps opencv-python-headless==4.13.0.92
      - name: Provision pinned font library (explicit download; matching stays offline)
        run: zing fonts fetch --all
      - name: Provision pinned caption OCR models (explicit download; study stays offline)
        run: python -m myzing.study.caption_models --fetch
      - name: Golden generation (real ffmpeg fixtures, hostile paths)
        run: python -m tools.eval.make_goldens --output "tools/eval/goldens"
      - name: Breakdown + profile eval with machine-readable report
        run: python -m tools.eval.run --sample --profiles --report "tools/eval/eval-report.json"
      - name: ffmpeg-marked test subset (skips are failures)
        run: pytest -q -m ffmpeg --expected-ffmpeg-tests 364
      - name: Keep eval report as artifact on failure (C#9)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report-ubuntu-latest
          path: tools/eval/eval-report.json
          if-no-files-found: warn

  # C#8 — focused Windows job: real ffmpeg on windows-latest running the
  # path-handling / ASS / render-smoke subset (hostile-path golden
  # generation + the full render integration oracle). Same no-skip rule.
  ffmpeg-smoke-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      ZING_REQUIRE_FFMPEG: "1"
      ZING_REQUIRE_OCR: "1"
      ZING_TEST_FETCH_FONTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ffmpeg (chocolatey)
        timeout-minutes: 10
        run: pwsh -NoProfile -File packaging/install_ffmpeg_windows.ps1
      - name: Verify ffmpeg version and required filters (C#8)
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
          for filter in drawtext subtitles sidechaincompress lut3d xfade acrossfade zoompan; do
            if ffmpeg -hide_banner -filters | awk '{print $2}' | grep -qx "$filter"; then
              echo "filter present: $filter"
            else
              echo "::error::required ffmpeg filter missing: $filter"
              exit 1
            fi
          done
      - run: pip install -e .[dev,layout,color,audio,memes,study] "rapidocr==3.9.1"
      - run: pip uninstall -y opencv-python
      - run: pip install --force-reinstall --no-deps opencv-python-headless==4.13.0.92
      - name: Provision pinned font library (explicit download; matching stays offline)
        run: zing fonts fetch --all
      - name: Provision pinned caption OCR models (explicit download; study stays offline)
        run: python -m myzing.study.caption_models --fetch
      - name: Path-handling / ASS / render smoke subset (skips are failures)
        run: pytest -q -m ffmpeg --expected-ffmpeg-tests 364

  # macOS smoke: frame extraction, six inspection tests, audio placement,
  # and the caption/ducking render oracle (Homebrew FFmpeg with libass).
  # The required-mode env makes a missing ffmpeg/ffprobe a
  # hard failure instead of an honest local-development skip.
  ffmpeg-smoke-macos:
    timeout-minutes: 30
    runs-on: macos-latest
    env:
      ZING_REQUIRE_FFMPEG: "1"
      ZING_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ffmpeg (Homebrew bottle with libass)
        timeout-minutes: 10
        run: |
          brew install --force-bottle ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Verify ffmpeg, ffprobe, libass, and lut3d
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          for filter in ass lut3d xfade acrossfade zoompan; do
            if ! awk '{print $2}' "$RUNNER_TEMP/ffmpeg-filters.txt" | grep -qx "$filter"; then
              echo "::error::required ffmpeg filter missing: $filter"
              exit 1
            fi
          done
      - run: pip install -e .[dev,audio,memes,color,study,layout]
      - run: pip uninstall -y opencv-python
      - run: pip install --force-reinstall --no-deps opencv-python-headless==4.13.0.92
      - name: Real media, inspection, render audio and animated meme gates (skips are failures)
        run: pytest -q tests/test_mcp_frames.py::test_get_frames_real_two_color_probe tests/test_inspect_ffmpeg.py tests/test_render_integration.py::test_clip_audio_follows_each_timeline_slot tests/test_render_integration.py::test_golden_edl_renders_with_content_probes_and_ducking tests/test_memes_video.py tests/test_director_ffmpeg.py tests/test_render_composition_ffmpeg.py tests/test_render_lut_ffmpeg.py tests/test_match_ffmpeg.py tests/test_e2e1_ffmpeg.py tests/test_continuity_ffmpeg.py tests/test_framing_ffmpeg.py tests/test_aspect_delivery_ffmpeg.py tests/test_reframe2_ffmpeg.py tests/test_music_ffmpeg.py tests/test_render_transitions_ffmpeg.py::test_supported_transition_pixels_frames_duration_audio tests/test_render_transitions_ffmpeg.py::test_mixed_chain_normalizes_inputs_and_keeps_fractional_audio_placement tests/test_render_transitions_ffmpeg.py::test_luts_precede_overlap_and_captions_follow_it tests/test_still.py::test_pick_real_video_and_gif_offline tests/test_studio_ffmpeg.py tests/test_source_map_ffmpeg.py -m ffmpeg --expected-ffmpeg-tests 233

  # S5 Lane B: fresh-host install gate — wheel -> bare venv -> first-run
  # surface, NO repo checkout on the tested path (packaged data must
  # carry everything). The gate record uploads as an artifact per OS.
  clean-install:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ffmpeg (apt)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (chocolatey)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: pwsh -NoProfile -File packaging/install_ffmpeg_windows.ps1
      - name: Install ffmpeg (brew)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install ffmpeg
      - name: Clean-host gate
        run: python packaging/clean_host_check.py --require-study --report clean-host-${{ matrix.os }}.json
      - name: Upload gate record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clean-host-${{ matrix.os }}
          path: clean-host-*.json
