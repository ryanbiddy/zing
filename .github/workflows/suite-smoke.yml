name: suite-smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      uoink_ref:
        description: >-
          Git ref of ryanbiddy/uoink to test against (branch, tag, or SHA).
          Leave at main for the ordinary single-branch gate.
        required: false
        default: main
      writer_ref:
        description: >-
          Git ref of ryanbiddy/writer to test against (branch, tag, or SHA).
          Leave at main for the ordinary single-branch gate.
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: suite-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic-family:
    name: deterministic family gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # workflow_dispatch inputs are absent on push, pull_request, and
      # schedule, so fall back to main there and leave those runs unchanged.
      UOINK_REF: ${{ github.event.inputs.uoink_ref || 'main' }}
      WRITER_REF: ${{ github.event.inputs.writer_ref || 'main' }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out Zing
        uses: actions/checkout@v5
        with:
          path: zing
          persist-credentials: false

      # The ref expression is repeated here rather than read from the job env
      # on purpose: an empty `ref:` silently checks out the default branch,
      # which is the exact main-looks-like-a-branch confusion this input pair
      # exists to remove. `'' || 'main'` is 'main' in expression syntax, so
      # these can never resolve to the empty string. A ref that does not exist
      # fails the checkout step loudly instead of falling back.
      - name: Check out Uoink (${{ github.event.inputs.uoink_ref || 'main' }})
        uses: actions/checkout@v5
        with:
          repository: ryanbiddy/uoink
          ref: ${{ github.event.inputs.uoink_ref || 'main' }}
          path: uoink
          persist-credentials: false

      - name: Check out Writer (${{ github.event.inputs.writer_ref || 'main' }})
        uses: actions/checkout@v5
        with:
          repository: ryanbiddy/writer
          ref: ${{ github.event.inputs.writer_ref || 'main' }}
          path: writer
          persist-credentials: false

      - name: Resolve the refs under test
        shell: bash
        run: |
          set -euo pipefail
          uoink_sha="$(git -C uoink rev-parse HEAD)"
          writer_sha="$(git -C writer rev-parse HEAD)"
          zing_sha="$(git -C zing rev-parse HEAD)"
          zing_ref="${GITHUB_REF#refs/}"
          {
            echo "UOINK_SHA=$uoink_sha"
            echo "WRITER_SHA=$writer_sha"
            echo "ZING_SHA=$zing_sha"
            echo "ZING_REF=$zing_ref"
          } >> "$GITHUB_ENV"
          if [ "$UOINK_REF" = "main" ] && [ "$WRITER_REF" = "main" ]; then
            verdict='**Peers are at `main`.** This run proves the Zing tree against Uoink main and Writer main only. It does **not** prove a multi-branch combination.'
          else
            verdict='**Peer refs are overridden.** This run proves the three checked-out heads against one another.'
          fi
          {
            echo "## suite-smoke sources"
            echo
            echo "$verdict"
            echo
            echo "| product | requested ref | resolved SHA |"
            echo "| --- | --- | --- |"
            echo "| uoink | \`$UOINK_REF\` | \`$uoink_sha\` |"
            echo "| writer | \`$WRITER_REF\` | \`$writer_sha\` |"
            echo "| zing | \`$zing_ref\` | \`$zing_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            zing/pyproject.toml
            writer/pyproject.toml
            uoink/requirements.txt

      - name: Install FFmpeg
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffprobe -version

      - name: Install Zing's runtime
        run: |
          python -m pip install \
            -e "./zing[all,dev]" \
            "Pillow==10.4.0" \
            "keyring==25.7.0"

      # Zing uses MCP SDK 2 and Writer still targets SDK 1, so Writer gets its
      # own venv (like Uoink below) instead of sharing one MCP pin.
      - name: Install Writer's runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/writer-venv"
          "$RUNNER_TEMP/writer-venv/bin/python" -m pip install \
            -e "./writer[dev]" \
            "mcp==1.27.1" \
            "Pillow==10.4.0" \
            "keyring==25.7.0"

      - name: Install Uoink's own server and MCP runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/uoink-venv"
          python - <<'PY'
          import os, re
          from pathlib import Path

          # Avoid desktop/ASR dependencies: the gate uses the server, MCP and
          # seeded media. Keep the selected checkout's pins, including SDK 2.
          names = {"mcp", "mcp-types", "httpx2", "httpcore2", "truststore", "pillow", "keyring"}
          pins = {}
          for line in Path("uoink/requirements.txt").read_text().splitlines():
              match = re.fullmatch(r"([A-Za-z0-9_-]+)==([^\s#]+)", line.strip())
              if match and match[1].lower() in names:
                  pins[match[1].lower()] = line.strip()
          assert {"mcp", "pillow", "keyring"} <= pins.keys(), "Uoink runtime pins missing"
          Path(os.environ["RUNNER_TEMP"], "uoink-runtime.txt").write_text("\n".join(pins.values()) + "\n")
          PY
          "$RUNNER_TEMP/uoink-venv/bin/python" -m pip install -r "$RUNNER_TEMP/uoink-runtime.txt"

      - name: Run the deterministic family scenario
        shell: bash
        working-directory: zing
        env:
          SMOKE_DIR: ${{ runner.temp }}/suite-smoke
          SMOKE_WORK_DIR: ${{ runner.temp }}/suite-smoke-work
        run: |
          set -o pipefail
          rm -rf "$SMOKE_DIR" "$SMOKE_WORK_DIR"
          mkdir -p "$SMOKE_DIR"
          python -m tools.eval.run_suite_smoke \
            --mode deterministic_ci \
            --uoink-repo "$GITHUB_WORKSPACE/uoink" \
            --uoink-python "$RUNNER_TEMP/uoink-venv/bin/python" \
            --writer-repo "$GITHUB_WORKSPACE/writer" \
            --writer-python "$RUNNER_TEMP/writer-venv/bin/python" \
            --zing-repo "$GITHUB_WORKSPACE/zing" \
            --work-dir "$SMOKE_WORK_DIR" \
            --output "$SMOKE_DIR/suite-smoke.json" \
            2> >(tee "$SMOKE_DIR/suite-smoke-failure.json" >&2)
          rm -f "$SMOKE_DIR/suite-smoke-failure.json"

      - name: Record the refs under test alongside the record
        if: always()
        shell: bash
        env:
          SMOKE_DIR: ${{ runner.temp }}/suite-smoke
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_DIR"
          cat > "$SMOKE_DIR/suite-smoke-refs.json" <<JSON
          {
            "record_contract": "zing.suite-smoke.refs",
            "version": 1,
            "event": "$GITHUB_EVENT_NAME",
            "run_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "requested_refs": {
              "uoink": "${UOINK_REF:-}",
              "writer": "${WRITER_REF:-}",
              "zing": "${ZING_REF:-}"
            },
            "resolved_revisions": {
              "uoink": "${UOINK_SHA:-}",
              "writer": "${WRITER_SHA:-}",
              "zing": "${ZING_SHA:-}"
            }
          }
          JSON

      - name: Independently evaluate the family record
        working-directory: zing
        env:
          SMOKE_DIR: ${{ runner.temp }}/suite-smoke
        run: |
          python -m tools.eval.suite_smoke \
            "$SMOKE_DIR/suite-smoke.json" \
            --report "$SMOKE_DIR/suite-smoke-eval.json"

      # A green record only means something if the trees it measured are the
      # trees this job checked out. Without this, a wrong `ref:` would produce
      # a perfectly green run whose sources quietly say "main".
      - name: Verify the record measured the checked-out revisions
        if: success()
        shell: bash
        env:
          SMOKE_DIR: ${{ runner.temp }}/suite-smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys

          record = json.load(
              open(os.path.join(os.environ["SMOKE_DIR"], "suite-smoke.json"), encoding="utf-8")
          )
          expected = {
              "uoink": os.environ["UOINK_SHA"],
              "writer": os.environ["WRITER_SHA"],
              "zing": os.environ["ZING_SHA"],
          }
          sources = record.get("sources") or {}
          bad = []
          for product, want in expected.items():
              got = (sources.get(product) or {}).get("revision")
              if got != want:
                  bad.append(f"{product}: record says {got!r}, checkout is {want!r}")
          if bad:
              print("record/checkout revision mismatch:", *bad, sep="\n  ")
              sys.exit(1)
          print("record sources match the checked-out revisions:")
          for product, want in expected.items():
              print(f"  {product} {want}")
          PY

      - name: Upload the path-free family record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: suite-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/suite-smoke/suite-smoke*.json
          if-no-files-found: error
          retention-days: 14
