<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(../fonts/Anton-Regular.ttf)}
@font-face{font-family:Plex;src:url(../fonts/IBMPlexSans.ttf);font-weight:100 700}
@font-face{font-family:Serif;src:url(../fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:Serif;font-style:italic;src:url(../fonts/InstrumentSerif-Italic.ttf)}
@font-face{font-family:Cap;src:url(../fonts/ZingCaption-800.ttf)}
:root{--ink:#17161C;--cream:#FBF4E4;--yellow:#FFD21F;--tomato:#E8452C;--teal:#1F8A8A;--blue:#2B50D8;--pink:#F7B7C5}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
#world{position:absolute;left:0;top:0;height:1920px;will-change:transform}
.panel{position:absolute;top:0;width:1080px;height:1920px;overflow:hidden}
.panel svg.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.card{position:absolute;transform-origin:50% 50%;visibility:hidden}
.sticker{font-family:Anton;text-transform:uppercase;line-height:1;padding:.14em .26em .1em;box-shadow:9px 9px 0 rgba(0,0,0,.3);white-space:nowrap;letter-spacing:.01em}
.note{background:var(--cream);color:var(--ink);font-family:Plex;border:4px solid var(--ink);padding:26px 30px 24px;box-shadow:9px 9px 0 rgba(0,0,0,.28)}
.note:before{content:"";position:absolute;left:50%;top:-22px;width:120px;height:40px;margin-left:-60px;background:rgba(255,210,31,.82);transform:rotate(-3deg);border-left:2px dashed rgba(0,0,0,.18);border-right:2px dashed rgba(0,0,0,.18)}
.note .k{font-size:30px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.62;margin-bottom:8px}
.note .v{font-family:Anton;font-size:74px;line-height:1.04;text-transform:uppercase}
.note .row{font-family:Anton;font-size:60px;line-height:1.25;text-transform:uppercase;display:flex;align-items:center;gap:20px}
.note .box{width:50px;height:50px;border:5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-family:Plex;font-weight:700;font-size:44px;color:var(--tomato);flex:none}
.pill{font-family:Cap;font-size:36px;letter-spacing:.06em;color:var(--cream);background:var(--ink);border:4px solid var(--cream);border-radius:60px;padding:12px 30px 10px;white-space:nowrap;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.tag{font-family:Plex;font-weight:700;font-size:32px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);padding:8px 16px;white-space:nowrap;box-shadow:5px 5px 0 rgba(0,0,0,.25);text-align:center;line-height:1.12}
.tag small{display:block;font-weight:500;font-size:22px;opacity:.7}
.sign{font-family:Anton;font-size:64px;color:#fff;background:#1E7A45;border:6px solid #fff;outline:5px solid #1E7A45;border-radius:14px;padding:14px 30px 10px;text-transform:uppercase;white-space:nowrap;box-shadow:8px 8px 0 rgba(0,0,0,.3);text-align:center;line-height:1}
.sign small{display:block;font-family:Plex;font-weight:600;font-size:28px;letter-spacing:.14em;margin-top:8px}
.doc{background:#fff;color:var(--ink);border:4px solid var(--ink);padding:34px 36px 30px;font-family:Plex;box-shadow:9px 9px 0 rgba(0,0,0,.3);width:520px}
.doc .h{font-size:26px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.doc .n{font-family:Anton;font-size:104px;line-height:1.02;margin:6px 0 4px}
.doc .l{height:8px;background:var(--ink);opacity:.14;margin:12px 0}
.doc .d{font-family:Serif;font-style:italic;font-size:54px}
.stamp{font-family:Anton;font-size:66px;color:var(--tomato);border:8px solid var(--tomato);border-radius:14px;padding:6px 22px 2px;text-transform:uppercase;white-space:nowrap;mix-blend-mode:multiply}
.plaque{background:#C9A24B;color:#2A1F08;border:6px solid #7A5C1E;outline:4px solid #E7C873;outline-offset:-16px;padding:44px 48px 40px;width:640px;text-align:center;box-shadow:10px 10px 0 rgba(0,0,0,.32)}
.plaque .t{font-family:Anton;font-size:66px;letter-spacing:.04em;text-transform:uppercase}
.plaque .q{font-family:Serif;font-style:italic;font-size:60px;line-height:1.08;margin-top:14px}
.plaque i{position:absolute;width:16px;height:16px;border-radius:50%;background:#7A5C1E}
.credits{font-family:Plex;font-weight:500;font-size:27px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.credits span{background:var(--cream);padding:3px 12px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#bar{position:absolute;left:0;top:0;width:1080px;z-index:20}
#bar div{position:absolute;top:64px;font-family:Plex;font-weight:600;font-size:27px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:5px 14px}
#chapter{position:absolute;left:50%;top:1750px;transform:translateX(-50%);z-index:20;max-width:960px;white-space:normal;text-align:center}
#captions{position:absolute;z-index:21;display:flex;align-items:center;justify-content:center;padding:16px 48px;pointer-events:none}
#captions .phrase{font-family:Cap;font-size:56px;line-height:1.15;white-space:nowrap;color:var(--cream);background:var(--ink);padding:12px 20px;text-align:center}
#captions .current{color:var(--yellow)}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:30;pointer-events:none;mix-blend-mode:multiply;opacity:.2}
.puppet{filter:drop-shadow(8px 8px 0 rgba(0,0,0,.26))}
.image-prop{filter:drop-shadow(6px 7px 0 rgba(0,0,0,.22))}
.headline-block{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;will-change:transform}
.headline-chapter{position:absolute;left:64px;top:190px;font-family:Cap;font-size:32px;line-height:1.15;letter-spacing:.04em;padding:12px 24px 10px;border-radius:60px;max-width:952px}
.headline-type{position:absolute;left:64px;top:300px;width:952px;overflow:visible;font-family:Anton;line-height:.98;text-transform:uppercase}
.headline-ghost{position:absolute;right:40px;top:1290px;font-family:Anton;font-size:560px;line-height:1;opacity:.09;letter-spacing:-.02em}
.headline-word{position:absolute;white-space:nowrap;transform-origin:50% 50%}
.headline-badge{position:absolute;transform-origin:50% 50%}
.headline-face{width:100%;height:100%;border:12px solid var(--cream);border-radius:50%;background:var(--cream);box-shadow:9px 9px 0 rgba(0,0,0,.3);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--ink);font-family:Anton}
.headline-face img{width:100%;height:100%;object-fit:cover}
.headline-face small{font:600 24px Plex}
.headline-name{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);width:max-content;max-width:100%;overflow-wrap:anywhere;font:700 28px/1.12 Plex;text-align:center;background:var(--cream);color:var(--ink);padding:8px 14px;box-shadow:5px 5px 0 rgba(0,0,0,.25)}
.headline-picture{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
#headline-progress{position:absolute;left:48px;top:1900px;height:10px;width:984px;z-index:20;transform-origin:0 50%}
.look-headline #chapter{display:none}
.picture-card{filter:drop-shadow(9px 9px 0 rgba(0,0,0,.3))}
.picture-name{font-family:'Serif';font-style:italic;font-size:30px;fill:var(--ink)}
.look-comic{background:#F4EEDF!important}
.look-comic #world{transform-origin:0 0}
.look-comic #chapter{display:none}
.look-comic #grain{opacity:.3}
.comic-page{position:absolute;left:0;top:0;background:#F4EEDF}
.directed-viewport{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.comic-frame{position:absolute;border:10px solid var(--ink);width:1100px;height:1940px;background:var(--ink)}
.comic-frame>.panel{left:0;top:0}
.comic-dots{position:absolute;inset:0;pointer-events:none;z-index:12;mix-blend-mode:multiply;opacity:.09;background-image:radial-gradient(var(--ink) 1.4px,transparent 1.6px);background-size:9px 9px}
.comic-chapter{position:absolute;left:32px;top:112px;max-width:1016px;padding:12px 20px 10px;background:var(--yellow);border:5px solid var(--ink);font:48px/1.08 Anton;color:var(--ink);text-transform:uppercase;z-index:13;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
</style></head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="bar"><div id="barL" style="left:48px"></div><div id="barR" style="right:48px"></div></div>
  <div id="chapter" class="pill"></div>
  <svg id="grain"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 -1.2 1.05"/></filter><rect width="1080" height="1920" filter="url(#gf)"/></svg>
</div>
<script>
'use strict';
const W = 1080, H = 1920, FLOOR = 1500, FPS12 = 12;
const CAPTION_BAND = Object.freeze({x:0,y:1560,width:1080,height:160});
window.captionBand = CAPTION_BAND;
const INK = '#17161C', CREAM = '#FBF4E4', YELLOW = '#FFD21F', TOMATO = '#E8452C', TEAL = '#1F8A8A';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const backOut = p => { const c = 1.9; p = clamp(p) - 1; return 1 + (c + 1) * p * p * p + c * p * p; };
const easeIO = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const bounce = p => { p = clamp(p); const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p; if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375; return n * (p -= 2.625 / d) * p + .984375; };
const q12 = t => Math.floor(t * FPS12 + 1e-6) / FPS12;
const hash = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ---------- props: small paper drawings, origin at their base centre ----------
const paper = 'stroke="' + CREAM + '" stroke-width="5" stroke-linejoin="round"';
const PROPS = {
  image: (o, images) => {
    const im = images[o.image], w = o.w, href = esc(im.url).replace(/"/g, '&quot;');
    if (im.cut === 'sticker') { const h = w * im.h / im.w;
      return `<image class="image-prop" href="${href}" x="${-w / 2}" y="${-h}" width="${w}" height="${h}"/>`; }
    const border = 12, iw = w - 2 * border, ih = iw * im.h / im.w, h = ih + 2 * border;
    return `<g class="image-prop"><rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" fill="#fff"/>
      <image href="${href}" x="${-iw / 2}" y="${-h + border}" width="${iw}" height="${ih}"/>
      <rect x="${-Math.min(110, w * .4) / 2}" y="${-h - 13}" width="${Math.min(110, w * .4)}" height="32" fill="${YELLOW}" opacity=".8" transform="rotate(-5,0,${-h})"/></g>`;
  },
  blob: o => `<circle r="${o.r || 200}" fill="${o.fill || TOMATO}"/>`,
  dots: o => { let s = ''; const n = o.n || 9, g = o.gap || 26;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const dx = (i - (n - 1) / 2) * g, dy = (j - (n - 1) / 2) * g;
      if (o.round && Math.hypot(dx, dy) > n * g / 2) continue;
      s += `<circle cx="${dx}" cy="${dy}" r="${o.dot || 5}" fill="${o.fill || INK}"/>`; }
    return `<g opacity="${o.opacity ?? .5}">${s}</g>`; },
  window: o => { const night = o.night !== false;
    return `<g><rect x="-150" y="-330" width="300" height="330" fill="${night ? '#141433' : '#BFE3F5'}" stroke="${CREAM}" stroke-width="12"/>
      ${night ? `<circle cx="60" cy="-240" r="38" fill="#F6E7A8"/><circle cx="78" cy="-252" r="34" fill="#141433"/>
      <circle cx="-90" cy="-270" r="4" fill="#fff"/><circle cx="-40" cy="-120" r="4" fill="#fff"/><circle cx="100" cy="-90" r="4" fill="#fff"/><circle cx="-100" cy="-60" r="3" fill="#fff"/>`
      : `<circle cx="70" cy="-235" r="46" fill="${YELLOW}"/><path d="M-150,-70 q60,-50 120,0 q50,-40 110,0 q40,-30 70,0 v70 h-300z" fill="#fff"/>`}
      <path d="M0,-330 V0 M-150,-165 H150" stroke="${CREAM}" stroke-width="10"/></g>`; },
  skyline: o => { let s = '', x = -540; const hs = [220, 330, 180, 400, 260, 350, 200, 300, 240];
    hs.forEach((h, i) => { const w = 120; s += `<rect x="${x}" y="${-h}" width="${w - 8}" height="${h}" fill="${o.fill || '#2A2A55'}"/>`;
      for (let r = 0; r < Math.floor(h / 60) - 1; r++) for (let c = 0; c < 3; c++)
        if (hash(i * 9 + r, c) > .45) s += `<rect x="${x + 16 + c * 30}" y="${-h + 24 + r * 56}" width="16" height="26" fill="${o.lit || '#F6D873'}"/>`;
      x += w; });
    return s; },
  lamp: o => `<path d="M0,${-(o.drop || 300)} V-90" stroke="${INK}" stroke-width="6"/><path d="M-90,0 Q-80,-90 0,-96 Q80,-90 90,0z" fill="${o.fill || TOMATO}" ${paper}/><ellipse cx="0" cy="4" rx="46" ry="14" fill="#FFF3B0"/>`,
  sink: o => `<rect x="-230" y="-250" width="460" height="250" fill="#D8D2C4" ${paper}/><rect x="-190" y="-290" width="380" height="60" rx="10" fill="#9FB4BF" ${paper}/>
    <path d="M110,-290 v-90 q0,-50 -60,-50 v34 q24,0 24,20 v86z" fill="#C7CED2" ${paper}/><rect x="-230" y="-120" width="460" height="10" fill="rgba(0,0,0,.12)"/>
    <circle cx="-150" cy="-60" r="10" fill="${INK}"/><circle cx="150" cy="-60" r="10" fill="${INK}"/>`,
  plates: o => { let s = ''; for (let i = 0; i < (o.n || 7); i++) s += `<ellipse cx="${(hash(i, 3) - .5) * 14}" cy="${-14 - i * 22}" rx="96" ry="22" fill="#fff" stroke="${INK}" stroke-width="4"/>`; return s; },
  bubbles: o => { let s = ''; for (let i = 0; i < 9; i++) s += `<circle cx="${(hash(i, 1) - .5) * 260}" cy="${-hash(i, 2) * 150}" r="${12 + hash(i, 5) * 22}" fill="rgba(255,255,255,.85)" stroke="${INK}" stroke-width="3"/>`; return s; },
  crt: o => `<rect x="-250" y="-190" width="500" height="190" fill="#B9793F" ${paper}/><rect x="-250" y="-190" width="500" height="26" fill="#9A6230"/>
    <rect x="-130" y="-420" width="260" height="210" rx="18" fill="#E5DCC6" ${paper}/><rect x="-104" y="-396" width="208" height="150" rx="12" fill="#12301F"/>
    <path d="M-80,-300 l40,-50 30,30 30,-44 40,64" fill="none" stroke="#5CE08A" stroke-width="7" stroke-linejoin="round"/>
    <rect x="-60" y="-214" width="120" height="26" fill="#CFC5AC" stroke="${CREAM}" stroke-width="4"/>
    <rect x="-200" y="-206" width="110" height="16" rx="4" fill="#E5DCC6" stroke="${INK}" stroke-width="3"/>`,
  calendar: o => `<rect x="-95" y="-200" width="190" height="200" fill="#fff" ${paper}/><rect x="-95" y="-200" width="190" height="56" fill="${TOMATO}"/>
    <circle cx="-50" cy="-200" r="9" fill="${INK}"/><circle cx="50" cy="-200" r="9" fill="${INK}"/>
    <text x="0" y="-38" text-anchor="middle" font-family="Anton" font-size="94" fill="${INK}">${esc(o.text || '')}</text>`,
  cube: o => `<g fill="none" stroke="${o.stroke || INK}" stroke-width="7" stroke-linejoin="round"><path d="M-70,-40 h110 v110 h-110z"/><path d="M-30,-90 h110 v110 h-110z"/><path d="M-70,-40 l40,-50 M40,-40 l40,-50 M40,70 l40,-50 M-70,70 l40,-50"/></g>`,
  chip: o => { let s = `<rect x="-70" y="-70" width="140" height="140" rx="10" fill="#1F3D2B" ${paper}/><rect x="-36" y="-36" width="72" height="72" fill="#7BD88F"/>`;
    for (let i = -2; i <= 2; i++) s += `<rect x="${i * 26 - 6}" y="-98" width="12" height="26" fill="#C9A24B"/><rect x="${i * 26 - 6}" y="72" width="12" height="26" fill="#C9A24B"/><rect x="-98" y="${i * 26 - 6}" width="26" height="12" fill="#C9A24B"/><rect x="72" y="${i * 26 - 6}" width="26" height="12" fill="#C9A24B"/>`;
    return s; },
  cup: o => `<path d="M-34,-70 h68 l-8,70 h-52z" fill="#fff" ${paper}/><path d="M34,-56 q34,0 30,24 q-4,22 -36,20" fill="none" stroke="#fff" stroke-width="10"/><ellipse cx="0" cy="-70" rx="34" ry="9" fill="#5A3A22"/>`,
  pancakes: o => { let s = ''; const n = o.n || 4;
    s += `<ellipse cx="0" cy="-8" rx="150" ry="30" fill="#fff" stroke="${INK}" stroke-width="5"/>`;
    for (let i = 0; i < n; i++) s += `<ellipse cx="${(hash(i, 8) - .5) * 16}" cy="${-34 - i * 34}" rx="112" ry="26" fill="#E2A857" stroke="#8A531B" stroke-width="5"/>`;
    const top = -34 - (n - 1) * 34;
    s += `<path d="M-96,${top - 4} q30,-22 96,-20 q70,2 96,20 q-10,40 -30,26 q-10,34 -30,8 q-30,10 -50,2 q-12,40 -34,6 q-30,0 -48,-42z" fill="#8A3F12"/>
      <rect x="-26" y="${top - 34}" width="52" height="30" rx="5" fill="#FFE27A" stroke="#C9A24B" stroke-width="4"/>`;
    return s; },
  booth: o => `<rect x="-560" y="-640" width="1120" height="640" fill="${o.seat || '#C5302A'}"/>
    ${[-420, -140, 140, 420].map(x => `<rect x="${x - 128}" y="-600" width="256" height="420" rx="34" fill="${o.seat2 || '#E8452C'}" stroke="#8E1E1A" stroke-width="5"/><circle cx="${x}" cy="-470" r="12" fill="#8E1E1A"/><circle cx="${x}" cy="-330" r="12" fill="#8E1E1A"/>`).join('')}`,
  table: o => `<rect x="-500" y="-60" width="1000" height="60" rx="10" fill="#F1E6CF" stroke="${INK}" stroke-width="5"/><rect x="-500" y="0" width="1000" height="18" fill="#9A9488"/>
    <rect x="-560" y="18" width="1120" height="${o.leg || 480}" fill="${o.bench || '#8E1E1A'}"/><rect x="-560" y="18" width="1120" height="16" fill="rgba(0,0,0,.25)"/>`,
  garage: o => `<path d="M-300,-360 L0,-560 L300,-360 V0 H-300z" fill="#F3EEE2" ${paper}/><path d="M-340,-350 L0,-590 L340,-350" fill="none" stroke="${TOMATO}" stroke-width="34" stroke-linejoin="round"/>
    <rect x="-210" y="-290" width="420" height="290" fill="#B9C4CC" stroke="${INK}" stroke-width="5"/>${[1, 2, 3, 4].map(i => `<path d="M-210,${-290 + i * 58} h420" stroke="${INK}" stroke-width="4" opacity=".5"/>`).join('')}
    <rect x="-40" y="-50" width="80" height="14" rx="6" fill="${INK}"/>`,
  tree: o => `<rect x="-14" y="-150" width="28" height="150" fill="#7A4B25"/><circle cx="0" cy="-210" r="100" fill="#2F7D6B" ${paper}/>`,
  cross: o => `<path d="M-90,-90 L90,90 M90,-90 L-90,90" stroke="${TOMATO}" stroke-width="34" stroke-linecap="round"/>`,
  star: o => `<path d="M0,-40 L10,-10 L40,0 L10,10 L0,40 L-10,10 L-40,0 L-10,-10z" fill="${o.fill || '#fff'}"/>`,
};

// ---------- sets: wall + floor ----------
function setBack(set) {
  const wall = set.wall || '#333', floor = set.floor || '#222';
  let s = `<rect width="${W}" height="${H}" fill="${wall}"/>`;
  if (set.pattern === 'tiles') { for (let y = 0; y < FLOOR; y += 90) for (let x = (y / 90 % 2) * 45 - 45; x < W; x += 90)
    s += `<rect x="${x + 3}" y="${y + 3}" width="84" height="84" rx="6" fill="rgba(255,255,255,${.05 + hash(x, y) * .07})"/>`; }
  if (set.pattern === 'stripes') for (let x = 0; x < W; x += 60) s += `<rect x="${x}" y="0" width="30" height="${FLOOR}" fill="rgba(0,0,0,.045)"/>`;
  if (set.pattern === 'check') for (let y = 0; y < FLOOR; y += 64) for (let x = 0; x < W; x += 64) if ((x / 64 + y / 64) % 2) s += `<rect x="${x}" y="${y}" width="64" height="64" fill="rgba(255,255,255,.045)"/>`;
  s += `<rect x="0" y="${FLOOR}" width="${W}" height="${H - FLOOR}" fill="${floor}"/><rect x="0" y="${FLOOR - 7}" width="${W}" height="14" fill="rgba(0,0,0,.28)"/>`;
  if (set.floor_pattern === 'check') for (let r = 0; r < 4; r++) for (let c = 0; c < 9; c++) if ((r + c) % 2)
    s += `<rect x="${c * 120}" y="${FLOOR + 7 + r * 105}" width="120" height="105" fill="rgba(0,0,0,.2)"/>`;
  if (set.floor_pattern === 'planks') for (let c = 1; c < 9; c++) s += `<rect x="${c * 120}" y="${FLOOR + 7}" width="4" height="420" fill="rgba(0,0,0,.18)"/>`;
  return s;
}

// ---------- puppet ----------

async function buildHeadline(story, T, base) {

  });

      lines:lines.map(line=>({...line,fit:headlineFit(line.text,areaHeight,measure)})),mentions,areaHeight};

        Object.assign(span.style,{left:word.x+'px',top:word.y+'px',fontSize:line.fit.size+'px',lineHeight:'.98',visibility:'hidden',

    beat.pictureLayer = svgEl('svg',{class:'headline-picture',viewBox:`0 0 ${W} ${H}`},block);

        color:beat.colors.accent === INK ? CREAM : INK,transform:'rotate(-3deg)'}); block.appendChild(sticker);
      const credits = document.createElement('div'); credits.className = 'credits';

function drawHeadlineFrame(beat,t) {

  }
  if (frame.fitLine) frame.fitLine.nodes.forEach((span,i) => {
    const word = frame.words[i]; span.style.visibility = word.visible ? 'visible' : 'hidden';
    span.style.color = word.color; span.style.transform = `scale(${word.scale})`;
  });
  for (const [id,node] of Object.entries(beat.badgeNodes)) {
    const badge = frame.badges.find(item=>item.id === id); node.root.style.visibility = badge ? 'visible' : 'hidden';
    if (!badge) continue;
    Object.assign(node.root.style,{left:badge.box.left+'px',top:badge.box.top+'px',width:badge.box.width+'px',height:badge.box.height+'px',
      transform:`scale(${badge.scale})`,zIndex:badge.small ? '1' : '2'});
    node.face.style.fontSize = (badge.small ? 66 : 130)+'px'; node.tag.style.fontSize = (badge.small ? 20 : 28)+'px';
    node.tag.style.maxWidth = (badge.small ? 170 : 340)+'px';

  if (frame.picture) {
    const picture = frame.picture;
    if (beat.pictureKey !== picture.id+':'+picture.width) {
      beat.pictureGroup.innerHTML = PROPS.image({image:picture.id,w:picture.width},HEADLINE.images);
      beat.pictureKey = picture.id+':'+picture.width;

function seekHeadline(t) {

async function build(story,T,base,vocabulary) {

      throw new Error('story vocabulary differs for '+key);

function seek(t) { return LOOKS[CURRENT_LOOK].seek(t); }
