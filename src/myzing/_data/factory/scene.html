:root{--ink:#F4F6FB;--yel:#FFD23F;--navy:#050C24;--accent-ink:#081233;--muted:rgba(244,246,251,.72);--glow:#13296E;--cap-bg:#07070B;--cap-ink:#F4F6FB;--cap-on:#FFD23F;--cap-radius:12px;--tag-bg:rgba(5,12,36,.55);--tag-ink:rgba(255,255,255,.88);--edge:transparent}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--navy)}

body{font-family:Inter,sans-serif;color:var(--ink);position:relative}
#hook,.g-lab,.g-item{color:var(--ink)}
.layer{position:absolute;overflow:hidden}
#top{background:#0A1430}

  background:radial-gradient(800px 600px at 50% 45%,var(--glow) 0%,transparent 70%),var(--navy);border-top:12px solid var(--edge)}

#logo{position:absolute;display:none;object-fit:contain;pointer-events:none}

      return `<span class="${on?'on':em?'em':''}">${esc(w.w.replace(/[,;:]$/,''))}</span>`; }).join(' ');
    if (CAP_SCALE > 1) { const fs = parseFloat(box.style.fontSize) || CAP_SIZE;   // room for the active word's scale, so it never eats a space
      for (const s of box.children || []) s.style.margin = `0 ${((CAP_SCALE - 1) / 2 * (s.offsetWidth || 0) / fs).toFixed(3)}em`; }
    if (CAP_DEFAULT || TH0.cap_font === 'ZingCaption') fitCaption(box, gi);
    const centered = ASPECT === '9x16' || CAP.y != null;
    let cy = captionBase(G, cbox, cap.offsetHeight, centered);
    if (!KIN || page) cy = captionY(gi, cy, cap, box, centered);
    if (page) {
      const scale = Math.max(1, CAP_SCALE) * Math.max(1, CAP.pop_from) * (CAP.overshoot ? 1.03 : 1);
      const stroke = TH0.cap_stroke_w ?? (CAP_DEFAULT ? 7 : 0);
      const h = (cap.offsetHeight+stroke*2)*scale, w = (box.offsetWidth+stroke*2)*scale;
      const y = cy + (centered ? 0 : cap.offsetHeight/2);
      if (y+h/2 > page.y0 && y-h/2 < page.y1 && (SW+w)/2 > page.x0 && (SW-w)/2 < page.x1) {
        captionPlate(box, true);
        if (CAP_DEFAULT || TH0.cap_font === 'ZingCaption') fitCaption(box, gi+':page');
        const h = (cap.offsetHeight+stroke*2)*scale;
        cy = Math.min(cy, (ASPECT === '9x16' ? 1440 : SH9) - (centered ? h/2 : h));
      }
    }
    cap.style.top = cy + 'px';
    cap.style.opacity = visible ? 1 : 0;
    const pop = lin(t, W[grp[0]].os, W[grp[0]].os + CAP.pop_ms/1000);
    cap.style.transform = `${centered ? 'translateY(-50%) ' : ''}scale(${mix(CAP.pop_from,1,CAP.overshoot ? back(pop) : easeOut(pop))})`;
  } else cap.style.opacity = 0;
  $('prog').style.width = (100*clamp(t/D.duration))+'%';
  $('prog').style.display = TH0.progress === false ? 'none' : '';
  $('srctag').textContent = PANEL && PANEL.brand !== false ? '' : D.sourceTag || '';
  $('srctag').style.display = $('srctag').textContent ? '' : 'none';
  $('srctag').style.top = (ASPECT === '9x16' ? 20 : 18) + 'px';
  const disclosure = $('disclosure'), notice = D.disclosure;
  disclosure.style.display = notice && t >= notice.from && t < notice.to ? 'block' : 'none';
  if (notice) {
    const b = G.spk || {x:0, y:0, w:SW, h:STAGE_H};
    disclosure.firstChild.textContent = notice.text;
    disclosure.style.left = (b.x + 32) + 'px'; disclosure.style.width = (b.w - 64) + 'px';
    let y = b.y + 80;
    if (G.hook === 'pill' && hookOn) {
      const py = parseFloat(pill.style.top), bottom = py + pill.offsetHeight;
      if (y + disclosure.offsetHeight > py - 16 && y < bottom + 16) y = bottom + 24;
    }
    disclosure.style.top = y + 'px';
  }

  if (layout === 'graphic' && shot.graphic?.kind === 'endcard') $('logo').style.display = 'none';
  else placeLogo(hookOn, G.hook);
  return true;
};
